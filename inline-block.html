<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline & Block</title>

	<style>
		body{
			font-family: sans-serif;
			font-size: 20px;
			line-height: 150%;
			margin: 5rem;
		}
		div{
			border: 2px solid #69F;
			padding: 1rem;
		}
		span {
			border-bottom: 2px solid #F69;
		}
	</style>

</head>
<body>

	<div>
		Lorem ipsum dolor sit amet consectetur, 
		<span>
			unde laborum quae culpa blanditiis illo sint 
			laboriosam in eum voluptates odio natus ea corporis, 
			adipisicing elit. Iste consequuntur nesciunt a, 
		</span>
		expedita maxime repellendus.
	</div>
	
</body>
</html>
