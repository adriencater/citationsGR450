<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
	
	<style>
		body { font-family: "JetBrains Mono", monospace; }

		.quote { 
			font-size: 5vw; 
		}
		.source { 
			font-size: 3vw;
			font-style: italic; 
			text-indent: -0.2em;
		}
		/* .important { background: magenta; } */

		.citation { 
			margin: 4rem;
			padding: 2rem;
			/* border: 1px solid lightblue; */
			/* border-radius: 1rem; */
			aspect-ratio: 16/9;
			background: linear-gradient(lightblue, blue);
			color: #FFF;
			align-content: center;
		}

		/* #machin { background: pink; } */

	</style>

</head>
<body>

	<div class="citation">
		<div class="quote">“Bonjour, monde.”</div>
		<div class="source important">— Anne Onyme</div>
	</div>

	<div class="citation" id="machin">
		<div class="quote">“Hello.”</div>
		<div class="source">— Steve</div>
	</div>
	

</body>
</html>
